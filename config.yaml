# 测速测试过滤选项配置
tester:
  threads: 16             # 测速线程并发数
  timeout_ms: 8000        # 握手和测速超时时长（毫秒）
  min_download_mbps: 0.05 # 判定为优质节点的最低下载速度限制 (改为 50KB/s，大大提高节点成活率，保证高可用)
  max_ping_ms: 5000       # 判定为优质节点的最大允许 Ping 值延迟 (ms)
  test_mode: "pingonly"   # 推荐改为 "pingonly"：在 CI 环境下测载极易被阻断，以在线(Ping通)作为最关键的筛选标准，可以吐出大量最新节点
  test_url: "http://cp.cloudflare.com/generate_204" # 延迟测试目的地址

# 订阅生成转换选项
convertor:
  max_output_nodes: 80    # 扩展最大输出节点数至 80，提高使用体验
  clash_group_name: "AutoProxy" # Clash 策略组名称
